[project]
name = "gds-idea-pkg-ai-reviewer"
description = "AI-powered code review agent using AWS Bedrock Claude and GitHub MCP Server"
readme = "README.md"
authors = [
    { name = "Jose Orjales", email = "Jose.Orjales@dsit.gov.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=1.0.11",
    "pydantic-ai-slim[mcp]>=1.0.11",
    "boto3>=1.40.41",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
    "pre-commit",
]
cdk = [
    "aws-cdk-lib>=2.180.0",
    "constructs>=10.0.0",
    "gds-idea-cdk-constructs>=0.6.4",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[[tool.uv.index]]
name = "gds-idea"
url = "https://co-cddo.github.io/gds-idea-pypi/simple/"

[tool.hatch.build.hooks.vcs]
version-file = "src/ai_reviewer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_reviewer"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["src/ai_reviewer/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.isort]
known-first-party = ["ai_reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["integration: tests that require external services"]

[tool.uv.sources]
gds-idea-cdk-constructs = { index = "gds-idea" }
